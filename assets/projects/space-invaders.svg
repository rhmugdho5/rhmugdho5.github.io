<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Retro CRT illustration for the Space Invaders console game">
  <defs>
    <radialGradient id="crt" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#0d1a16"/><stop offset="1" stop-color="#030806"/></radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".28"/></pattern>
    <radialGradient id="vig" cx=".5" cy=".5" r=".7"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="640" fill="#0a0f14"/>
  <rect x="60" y="40" width="880" height="560" rx="46" fill="#111a22" stroke="#9AAFBD" stroke-opacity=".25" stroke-width="2"/>
  <rect x="96" y="76" width="808" height="488" rx="30" fill="url(#crt)"/>
  <g font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" text-anchor="middle" filter="url(#glow)">
    <text x="130" y="118" text-anchor="start" font-size="18" fill="#FFB84D">SCORE</text>
    <text x="870" y="118" text-anchor="end" font-size="18" fill="#FFB84D">BOSS</text>
    <!-- enemy rows -->
    <g font-size="34" fill="#4dffc4">
      <text x="260" y="196">/o\</text><text x="360" y="196">/o\</text><text x="460" y="196">/o\</text><text x="560" y="196">/o\</text><text x="660" y="196">/o\</text><text x="760" y="196">/o\</text>
    </g>
    <g font-size="34" fill="#36A9FF">
      <text x="260" y="256">&lt;W&gt;</text><text x="360" y="256">&lt;W&gt;</text><text x="460" y="256">&lt;W&gt;</text><text x="560" y="256">&lt;W&gt;</text><text x="660" y="256">&lt;W&gt;</text><text x="760" y="256">&lt;W&gt;</text>
    </g>
    <g font-size="34" fill="#FFB84D">
      <text x="260" y="316">\M/</text><text x="360" y="316">\M/</text><text x="460" y="316">\M/</text><text x="560" y="316">\M/</text><text x="660" y="316">\M/</text><text x="760" y="316">\M/</text>
    </g>
    <!-- shots -->
    <g font-size="30" fill="#EAF2F8"><text x="520" y="400">|</text><text x="520" y="430" fill-opacity=".5">|</text><text x="360" y="372" fill="#FFB84D">*</text></g>
    <!-- shields -->
    <g font-size="26" fill="#4dffc4" fill-opacity=".8"><text x="250" y="480">[###]</text><text x="500" y="480">[###]</text><text x="750" y="480">[###]</text></g>
    <!-- ship -->
    <g font-size="30" fill="#EAF2F8"><text x="520" y="526">/^\</text></g>
  </g>
  <rect x="96" y="76" width="808" height="488" rx="30" fill="url(#scan)"/>
  <rect x="96" y="76" width="808" height="488" rx="30" fill="url(#vig)"/>
  <circle cx="860" cy="590" r="5" fill="#FFB84D" fill-opacity=".8"/>
</svg>
