    <path d="M0 12a12 12 0 0 1 12-12h836a12 12 0 0 1 12 12v34H0z" fill="#0e1c2d"/>
    <circle cx="26" cy="23" r="6" fill="#9AAFBD" fill-opacity=".35"/><circle cx="48" cy="23" r="6" fill="#9AAFBD" fill-opacity=".35"/><circle cx="70" cy="23" r="6" fill="#9AAFBD" fill-opacity=".35"/>
    <text x="104" y="28" font-size="14" fill="#9AAFBD">pact <tspan fill="#00E6AD">&gt;</tspan> console</text>
