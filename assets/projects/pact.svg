        <g transform="translate(0 140)"><rect width="580" height="44" rx="6" fill="none" stroke="#9AAFBD" stroke-opacity=".14"/><rect x="16" y="17" width="90" height="10" rx="5" fill="#EAF2F8" fill-opacity=".75"/><rect x="190" y="17" width="100" height="10" rx="5" fill="#9AAFBD" fill-opacity=".45"/><rect x="380" y="17" width="120" height="10" rx="5" fill="#9AAFBD" fill-opacity=".35"/><rect x="500" y="12" width="64" height="20" rx="10" fill="#36A9FF" fill-opacity=".2" stroke="#36A9FF" stroke-opacity=".6"/></g>
