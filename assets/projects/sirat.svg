<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Application-style illustration for Sirat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08231f"/><stop offset="1" stop-color="#07111c"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E6AD"/><stop offset="1" stop-color="#36A9FF"/></linearGradient>
    <pattern id="gp" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M20 2 38 20 20 38 2 20z" fill="none" stroke="#00E6AD" stroke-opacity=".07"/></pattern>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00E6AD" stop-opacity=".28"/><stop offset="1" stop-color="#00E6AD" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1000" height="640" fill="url(#bg)"/><rect width="1000" height="640" fill="url(#gp)"/>
  <!-- app window -->
  <g transform="translate(90 70)">
    <rect width="820" height="500" rx="16" fill="#0a1a22" stroke="#9AAFBD" stroke-opacity=".22"/>
    <path d="M0 16a16 16 0 0 1 16-16h788a16 16 0 0 1 16 16v38H0z" fill="#0f2430"/>
    <circle cx="28" cy="27" r="6" fill="#9AAFBD" fill-opacity=".35"/><circle cx="50" cy="27" r="6" fill="#9AAFBD" fill-opacity=".35"/><circle cx="72" cy="27" r="6" fill="#9AAFBD" fill-opacity=".35"/>
    <text x="410" y="32" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#9AAFBD" letter-spacing="2">SIRAT</text>
    <!-- sidebar -->
    <g transform="translate(24 78)">
      <rect width="170" height="52" rx="10" fill="#00E6AD" fill-opacity=".14" stroke="#00E6AD" stroke-opacity=".5"/>
      <circle cx="28" cy="26" r="8" fill="none" stroke="#00E6AD" stroke-width="2"/><text x="52" y="31" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="600" fill="#EAF2F8">Salah</text>
      <g transform="translate(0 66)"><rect width="170" height="52" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#9AAFBD" stroke-opacity=".18"/>
      <g fill="none" stroke="#36A9FF" stroke-width="2"><circle cx="20" cy="26" r="4"/><circle cx="30" cy="20" r="4"/><circle cx="38" cy="29" r="4"/></g><text x="56" y="31" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="600" fill="#cfe0ea">Dhikr</text></g>
      <g transform="translate(0 132)" fill="#9AAFBD" fill-opacity=".14"><rect width="170" height="12" rx="6"/><rect y="26" width="120" height="12" rx="6"/><rect y="52" width="146" height="12" rx="6"/></g>
    </g>
    <!-- main -->
    <g transform="translate(540 285)">
      <circle r="190" fill="url(#halo)"/>
      <circle r="150" fill="none" stroke="#36A9FF" stroke-opacity=".2"/>
      <circle r="112" fill="none" stroke="#00E6AD" stroke-opacity=".3" stroke-dasharray="3 9"/>
      <g fill="none" stroke="url(#ac)" stroke-width="2.4" stroke-linejoin="round"><rect x="-70" y="-70" width="140" height="140"/><rect x="-70" y="-70" width="140" height="140" transform="rotate(45)"/></g>
      <path d="M14 -46a46 46 0 1 0 0 92a36 36 0 1 1 0 -92z" fill="url(#ac)"/><circle cx="40" cy="-26" r="5" fill="#EAF2F8"/>
    </g>
    <!-- bead string -->
    <path d="M230 440C330 500 750 500 790 420" fill="none" stroke="#00E6AD" stroke-opacity=".25"/>
    <g fill="#0a1a22" stroke="#00E6AD" stroke-opacity=".7" stroke-width="2">
      <circle cx="262" cy="456" r="8"/><circle cx="300" cy="473" r="8"/><circle cx="342" cy="484" r="8"/><circle cx="386" cy="490" r="8"/><circle cx="430" cy="493" r="8"/><circle cx="474" cy="493" r="8"/><circle cx="518" cy="492" r="8"/><circle cx="562" cy="489" r="8"/>
    </g>
    <circle cx="606" cy="484" r="8" fill="#00E6AD"/>
  </g>
</svg>
